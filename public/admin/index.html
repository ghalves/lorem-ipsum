<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miaou · Dashboard</title>
  <link rel="icon" href="../brand/favicon-32.png" sizes="32x32">
  <link rel="icon" href="../brand/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <header class="mbar">
      <button class="mbar-btn" type="button" id="btnNav" aria-label="Abrir menu" aria-expanded="false" aria-controls="side">
        <span id="navIco"></span>
      </button>
      <div class="brand"><img src="../brand/miaou.png" alt="Miaou" width="84" height="28"></div>
    </header>

    <aside class="side" id="side">
      <div class="brand">
        <img src="../brand/miaou.png" alt="Miaou" width="90" height="30">
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do painel">
        <button role="tab" data-tab="tryon" data-icon="home4" aria-selected="true">Visão geral</button>
        <button role="tab" data-tab="products" data-icon="bag" aria-selected="false">Produtos</button>
        <button role="tab" data-tab="leads" data-icon="users" aria-selected="false">Leads</button>
        <button role="tab" data-tab="plan" data-icon="dashboard-speed" aria-selected="false">Planos</button>
        <button role="tab" data-tab="prefs" data-icon="settings" aria-selected="false">Preferências</button>
      </nav>
      <!-- loja: status, interruptor e uso do mês (cartão escuro com o degradê do Miaou) -->
      <div class="side-foot">
        <div class="glow">
          <div class="night store">
            <div class="store-top">
              <div class="store-id">
                <b id="storeName">Loja</b>
                <span class="state" id="enabledLabel">Ativo na loja</span>
              </div>
              <label class="switch" title="Ativar ou desativar na loja">
                <input type="checkbox" id="enabled" aria-label="Provador ativo na loja"><span></span>
              </label>
            </div>
            <div class="store-quota" id="storeQuota" hidden>
              <hr>
              <div class="store-plan" id="storePlan"></div>
              <div class="store-use"><b id="storeUsed">0</b><span id="storeOf"></span></div>
              <div class="meter" id="storeMeter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Provas usadas no mês"><i></i></div>
              <div class="store-cap"><span id="storePct"></span><span id="storeRenew"></span></div>
            </div>
            <button class="btn light sm block" type="button" id="storePlanBtn">Ver planos</button>
          </div>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main id="view" class="view"><p class="muted">Carregando…</p></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="icons.js"></script>
  <script src="admin.js"></script>
</body>
</html>
